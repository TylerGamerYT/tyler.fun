        *, *::before, *::after { box-sizing: border-box; }

            padding: 10px 16px;

        }
        .notice-bar span {

        .back-home:hover { color: #fff; }
        .container { position: relative; z-index: 1; padding: 40px 24px 60px; max-width: 680px; width: 100%; margin: 0 auto; }

            border: 1px solid rgba(51,65,85,0.6); overflow: hidden;

        .banner-pattern {
            position: absolute; inset: 0; opacity: 0.25;

                              radial-gradient(circle at 75% 30%, #fb7185 0%, transparent 45%),
                              radial-gradient(circle at 50% 90%, #e879f9 0%, transparent 40%);
        }

        .avatar-wrap { padding: 0 24px; position: relative; z-index: 2; }
        .avatar {
            width: 88px; height: 88px; border-radius: 50%;
            border: 4px solid #020617;
            background: linear-gradient(135deg, #500724, #831843);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem;
        }

        .profile-info { padding: 12px 24px 24px; }
        .name-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
        .display-name { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 900; color: #f8fafc; }

        /* Icon Badge Styles */
        .badge-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            vertical-align: middle;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .badge-icon:hover {
            transform: scale(1.15);
        }

        .handle { font-size: 0.9rem; color: #475569; margin-bottom: 12px; }

        .stats-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid rgba(51,65,85,0.4); }
        .stat-item { display: flex; flex-direction: column; gap: 2px; }
        .stat-num { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: #f8fafc; }
        .stat-lbl { font-size: 0.72rem; color: #475569; text-transform: uppercase; letter-spacing: 1.5px; }

        .claimed-box {
            background: rgba(244,114,182,0.06); border: 1px solid rgba(244,114,182,0.2);
            border-radius: 16px; padding: 28px 24px; text-align: center;
            margin-bottom: 16px;
        }
        .claimed-emoji { font-size: 2.5rem; margin-bottom: 10px; }
        .claimed-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: #f472b6; margin-bottom: 6px; }
        .claimed-text { font-size: 0.85rem; color: #64748b; line-height: 1.6; }

        .coming-soon {
            background: rgba(15,23,42,0.65); border: 1px solid rgba(51,65,85,0.5);
            border-radius: 14px; padding: 20px 24px; text-align: center;
            color: #334155; font-size: 0.85rem; font-style: italic;
        }
