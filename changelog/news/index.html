<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>News & Releases | tyler.fun</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  >

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      background: #020617;
      color: #fff;
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          ellipse 80% 60% at 50% 35%,
          #1e3a8a44 0%,
          transparent 70%
        );
      z-index: 0;
      pointer-events: none;
    }

    .back-home {
      position: fixed;
      top: 20px;
      left: 24px;
      font-size: 0.85rem;
      color: #475569;
      text-decoration: none;
      transition: color 0.2s;
      z-index: 20;
    }

    .back-home:hover {
      color: #fff;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 820px;
      width: 100%;
      margin: auto;
      padding: 90px 24px 80px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 42px;
    }

    .eyebrow {
      color: #3b82f6;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .page-header h1 {
      font-family: "Syne", sans-serif;
      font-size: clamp(2.5rem, 9vw, 4rem);
      font-weight: 900;
      letter-spacing: -3px;
      margin: 0 0 10px;
    }

    .page-header p {
      color: #64748b;
      font-size: 0.95rem;
      margin: 0;
    }

    .archive {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .release-card {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      color: inherit;
      font-family: inherit;
      background: rgba(15, 23, 42, 0.58);
      border: 1px solid rgba(51, 65, 85, 0.55);
      border-radius: 17px;
      padding: 22px;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 0.5s ease forwards;
    }

    .release-card:nth-child(1) { animation-delay: 0.05s; }
    .release-card:nth-child(2) { animation-delay: 0.1s; }
    .release-card:nth-child(3) { animation-delay: 0.15s; }
    .release-card:nth-child(4) { animation-delay: 0.2s; }
    .release-card:nth-child(5) { animation-delay: 0.25s; }
    .release-card:nth-child(6) { animation-delay: 0.3s; }
    .release-card:nth-child(7) { animation-delay: 0.35s; }
    .release-card:nth-child(8) { animation-delay: 0.4s; }
    .release-card:nth-child(9) { animation-delay: 0.45s; }
    .release-card:nth-child(10) { animation-delay: 0.5s; }
    .release-card:nth-child(11) { animation-delay: 0.55s; }
    .release-card:nth-child(12) { animation-delay: 0.6s; }
    .release-card:nth-child(13) { animation-delay: 0.65s; }
    .release-card:nth-child(14) { animation-delay: 0.7s; }

    .release-card:hover {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 246, 0.45);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .release-card.latest {
      border-color: rgba(59, 130, 246, 0.38);
      background:
        linear-gradient(
          135deg,
          rgba(30, 58, 138, 0.2),
          rgba(15, 23, 42, 0.7)
        );
    }

    .release-card.news {
      border-color: rgba(168, 85, 247, 0.3);
      background:
        linear-gradient(
          135deg,
          rgba(88, 28, 135, 0.16),
          rgba(15, 23, 42, 0.7)
        );
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 11px;
    }

    .version-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .version {
      font-family: "Syne", sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .latest-badge {
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .news-badge {
      color: #c084fc;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.25);
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .date {
      color: #475569;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    .title {
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      font-size: 0.8rem;
      line-height: 1.55;
      margin-bottom: 17px;
      max-width: 650px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stat {
      color: #64748b;
      background: rgba(2, 6, 23, 0.35);
      border: 1px solid rgba(51, 65, 85, 0.45);
      border-radius: 6px;
      padding: 4px 7px;
      font-size: 0.58rem;
      font-weight: 600;
    }

    .stat strong {
      color: #94a3b8;
    }

    .view {
      color: #3b82f6;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .release-card:hover .view {
      transform: translateX(3px);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      position: relative;
      width: min(700px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 20px;
      padding: 28px;
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(30, 64, 175, 0.12);
      transform: translateY(15px) scale(0.98);
      transition: transform 0.25s ease;
    }

    .modal.active .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 7px;
    }

    .modal-version {
      font-family: "Syne", sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
    }

    .modal-date {
      color: #475569;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding-top: 8px;
    }

    .modal-title {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .close {
      position: absolute;
      top: 16px;
      right: 18px;
      border: 0;
      background: rgba(51, 65, 85, 0.3);
      color: #64748b;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .close:hover {
      color: #fff;
      background: rgba(59, 130, 246, 0.25);
    }

    .changes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .change {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(2, 6, 23, 0.4);
      border: 1px solid rgba(51, 65, 85, 0.45);
      border-radius: 10px;
      padding: 11px 13px;
      color: #cbd5e1;
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .change-tag {
      flex-shrink: 0;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 7px;
      border-radius: 99px;
    }

    .tag-new {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .tag-fix {
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.22);
    }

    .tag-change {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.22);
    }

    .tag-remove {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.22);
    }

    .modal-footer {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid rgba(51, 65, 85, 0.45);
      color: #334155;
      font-size: 0.68rem;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 78px 16px 60px;
      }

      .back-home {
        top: 16px;
        left: 16px;
      }

      .release-card {
        padding: 18px;
      }

      .card-top {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .card-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .view {
        display: none;
      }

      .modal-box {
        padding: 22px;
        border-radius: 16px;
      }

      .modal-header {
        padding-right: 25px;
      }
    }
  </style>
</head>

<body>

          <div class="view">View release →</div>
        </div>
      </button>

      <!-- v0.1 -->

      <button
        class="release-card"
        data-version="v0.1"
        data-date="April 2026"
        data-title="The beginning — it exists"
      >
        <div class="card-top">
          <div class="version-wrap">
            <div class="version">v0.1</div>
          </div>

          <div class="date">April 2026</div>
        </div>

        <div class="title">
          The beginning — it exists
        </div>

        <div class="description">
          The original tyler.fun launch on GitHub Pages. A coming-soon page,
          socials button and the first repository.
        </div>

        <div class="card-bottom">
          <div class="stats">
            <div class="stat"><strong>3</strong> New</div>
          </div>

          <div class="view">View release →</div>
        </div>
      </button>

    </section>

  </main>

  <!-- Release Modal -->

  <div class="modal" id="modal">

    <div class="modal-box">

      <button class="close" id="closeModal">×</button>

      <div class="modal-header">
        <div class="modal-version" id="modalVersion">v1.3.1</div>
        <div class="modal-date" id="modalDate">September 2026</div>
      </div>

      <div class="modal-title" id="modalTitle">
        Release title
      </div>

      <div class="changes" id="modalChanges"></div>

      <div class="modal-footer">
        tyler.fun changelog · release archive
      </div>

    </div>

  </div>

  <script>
    /* =========================================
       Release data
    ========================================== */

    const releases = {

      "v1.3.1": [
        ["New", "Added the new /changelog/news/ archive for individual news and release posts."],
        ["New", "Added individual version page support using /changelog/news/v1.3.1/ style URLs."],
        ["New", "Added the foundation for future news posts, announcements and release articles."],
        ["Change", "Reworked the release archive structure so each major update can have its own permanent page."]
      ],

      "v1.3": [
        ["New", "Added the official ✓ Verified badge to user profiles."],
        ["New", "Added the 👤 Member badge for registered tyler.fun members."],
        ["New", "Added the ✉️ Email Verified badge for verified email addresses."],
        ["New", "Added interactive badge information popups."],
        ["New", "Expanded the profile identity system with clearer account roles and verification status."],
        ["New", "Added profile badge assets for Tyler, Admin, Staff, Member, Verified and Email Verified accounts."],
        ["Change", "Updated badge spacing and presentation for multiple badges beside display names."],
        ["Fix", "Improved badge interactions so badges do not interfere with other profile controls."]
      ],

      "v1.2": [
        ["New", "Added official ✓ Verified icons across user profiles and comments."],
        ["New", "Added interactive 🏅 profile badges with click interactions."],
        ["New", "Added the Load Older Updates history section with staggered animations."],
        ["Change", "Overhauled glassmorphism card layouts, starfield particle speed and mobile responsiveness."],
        ["Fix", "Fixed relative routing links across /users/ and /games/ subdirectories."]
      ],

      "v1.1": [
        ["Change", "Moved game pages into games/<game-name>/index.html for cleaner URLs."],
        ["Change", "Updated homepage game cards to use the new folder URLs."],
        ["Change", "Moved the changelog into changelog/index.html."],
        ["New", "Added cleaner URL routes for changelog, games and user profiles."]
      ],

      "v1.0": [
        ["New", "10 more games moved to public: Memory Grid, Number Memory, RPS vs AI, Whack-a-Mole, Runaway Snake, Gravity Flip, Cursed Clicker, Dodge the Dots, Evil Simon and Spin the Wheel."],
        ["New", "7 new preview games: Aim Trainer, Two Truths One Lie, Math Sprint, Pixel Art, Colour Flood, Moving Minesweeper and Scared Asteroids."],
        ["New", "Login and signup pages with GitHub OAuth."],
        ["New", "NEW badge added to recently public games."]
      ],

      "v0.9": [
        ["Change", "Moved from GitHub Pages to Vercel."],
        ["Change", "Restructured all user profiles into the /users/ folder."],
        ["Change", "Updated Back home links across profile pages."],
        ["New", "Added the @ban profile with banned account styling and redirect support."]
      ],

      "v0.8": [
        ["New", "Profile pages created for Tyler, Fish, Tawsif, Ashley, Angle and Aaban."],
        ["New", "Official system accounts added: @admin, @staff, @support and @tyler.fun."],
        ["New", "Guest profile added at /Guest."],
        ["New", "Guest icon added to the homepage."],
        ["New", "Real-time game search added."],
        ["New", "tyler.fun team profile created."]
      ],

      "v0.7": [
        ["New", "Cursed Clicker added."],
        ["New", "Dodge the Dots added."],
        ["New", "Evil Simon added."],
        ["New", "Spin the Wheel added."],
        ["New", "Guess the Colour added."],
        ["New", "Survive the Clicks added."],
        ["New", "Chair Simulator added."]
      ],

      "v0.6": [
        ["New", "Custom 404 page added."],
        ["Change", "Reaction Time, Higher or Lower, Floor is Lava, Type Fast, Cursed Breakout and Don't Press It moved to public."]
      ],

      "v0.5": [
        ["New", "Changelog page added."],
        ["New", "Changelog link added to the homepage."]
      ],

      "v0.4": [
        ["New", "19 new preview games added."],
        ["Change", "First six games made public."],
        ["New", "Public / In Development badges added to game cards."],
        ["New", "Changelog system introduced."],
        ["New", "Shared Hold the Key leaderboard added."]
      ],

      "v0.3": [
        ["New", "Roast Clicker added."],
        ["New", "Impossible Button added."],
        ["New", "Hold the Key added with leaderboard support."],
        ["New", "Useless Machine added."],
        ["New", "Scroll to Win added."],
        ["New", "Word Scramble added."],
        ["New", "Preview-only game system added."]
      ],

      "v0.2": [
        ["Change", "Complete visual overhaul with dark blue styling, Syne typography and animated star particles."],
        ["New", "Logo collision animation added."],
        ["New", "Socials page added."],
        ["Fix", "GitHub profile picture loading fixed."],
        ["Change", "Staggered fade-in animations added."]
      ],

      "v0.1": [
        ["New", "Initial site launched on GitHub Pages."],
        ["New", "Coming soon landing page created."],
        ["New", "Repository created. 16 commits. The dream begins."]
      ]

    };

    /* =========================================
       Modal
    ========================================== */

    const modal = document.getElementById("modal");
    const closeModal = document.getElementById("closeModal");

    const modalVersion = document.getElementById("modalVersion");
    const modalDate = document.getElementById("modalDate");
    const modalTitle = document.getElementById("modalTitle");
    const modalChanges = document.getElementById("modalChanges");

    function tagClass(type) {
      if (type === "New") return "tag-new";
      if (type === "Fix") return "tag-fix";
      if (type === "Change") return "tag-change";
      if (type === "Remove") return "tag-remove";

      return "tag-change";
    }

    function openRelease(card) {

      const version = card.dataset.version;

      modalVersion.textContent = version;
      modalDate.textContent = card.dataset.date;
      modalTitle.textContent = card.dataset.title;

      modalChanges.innerHTML = "";

      const changes = releases[version] || [];

      changes.forEach(([type, text]) => {

        const change = document.createElement("div");
        change.className = "change";

        const tag = document.createElement("span");
        tag.className = `change-tag ${tagClass(type)}`;
        tag.textContent = type;

        const description = document.createElement("span");
        description.textContent = text;

        change.appendChild(tag);
        change.appendChild(description);

        modalChanges.appendChild(change);
      });

      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeRelease() {
      modal.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.querySelectorAll(".release-card").forEach(card => {
      card.addEventListener("click", () => {
        openRelease(card);
      });
    });

    closeModal.addEventListener("click", closeRelease);

    modal.addEventListener("click", event => {
      if (event.target === modal) {
        closeRelease();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeRelease();
      }
    });

    /* =========================================
       Background particles
    ========================================== */

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");

    let W;
    let H;
    let stars = [];
    let t = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];

      for (let i = 0; i < Math.floor((W * H) / 8000); i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.1 + 0.3,
          speed: Math.random() * 0.14 + 0.03,
          opacity: Math.random() * 0.45 + 0.1,
          ts: Math.random() * 0.01 + 0.003,
          to: Math.random() * Math.PI * 2
        });
      }
    }

    function draw() {

      ctx.clearRect(0, 0, W, H);

      t += 0.016;

      for (const s of stars) {

        ctx.beginPath();

        ctx.arc(
          s.x,
          s.y,
          s.r,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = `rgba(148,197,255,${Math.max(
          0,
          s.opacity +
          Math.sin(t * s.ts * 60 + s.to) * 0.14
        )})`;

        ctx.fill();

        s.y -= s.speed;

        if (s.y < -2) {
          s.y = H + 2;
          s.x = Math.random() * W;
        }
      }

      requestAnimationFrame(draw);
    }

    resize();
    initStars();
    draw();

    window.addEventListener("resize", () => {
      resize();
      initStars();
    });
  </script>

</body>
