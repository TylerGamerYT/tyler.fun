<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: #020617;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 40%, #1e3a8a44 0%, transparent 70%); z-index: 0; pointer-events: none; }

        .back-home { position: fixed; top: 20px; left: 24px; font-size: 0.85rem; color: #475569; text-decoration: none; transition: color 0.2s; z-index: 10; }
        .back-home:hover { color: #fff; }

        /* card */
        .card {
            position: relative; z-index: 1;
            background: rgba(15,23,42,0.8);
            border: 1px solid rgba(51,65,85,0.7);
            border-radius: 24px;
            padding: 40px 36px;
            width: 100%; max-width: 420px;
            margin: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: fadeUp 0.5s ease forwards;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* logo */
        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem; font-weight: 900;
            letter-spacing: -1px; margin-bottom: 28px;
            text-align: center;
        }
        .logo span { color: #60a5fa; }

        h1 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 900; margin: 0 0 6px; letter-spacing: -1px; }
        .sub { font-size: 0.85rem; color: #64748b; margin-bottom: 28px; }
        .sub a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        .sub a:hover { text-decoration: underline; }

        /* github btn */
        .github-btn {
            width: 100%; padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 20px; text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
        }
        .github-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }
        .github-btn svg { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; }

        /* divider */
        .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(51,65,85,0.6); }
        .divider span { font-size: 0.75rem; color: #334155; }

        /* form */
        .field { margin-bottom: 16px; }
        label { font-size: 0.78rem; font-weight: 600; color: #94a3b8; display: block; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 14px;
            background: rgba(30,41,59,0.6);
            border: 1px solid rgba(51,65,85,0.7);
            border-radius: 10px; color: #fff;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            outline: none; transition: border-color 0.2s, background 0.2s;
        }
        input:focus { border-color: rgba(96,165,250,0.5); background: rgba(30,41,59,0.9); }
        input::placeholder { color: #334155; }

        .forgot { font-size: 0.78rem; color: #475569; text-decoration: none; float: right; margin-top: -4px; display: block; transition: color 0.2s; }
        .forgot:hover { color: #60a5fa; }

        .submit-btn {
            width: 100%; padding: 13px;
            background: #2563eb;
            border: none; border-radius: 12px; color: #fff;
            font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
            cursor: not-allowed; margin-top: 8px; opacity: 0.6;
            transition: opacity 0.2s;
            position: relative;
        }

        .notice {
            margin-top: 20px; padding: 12px 14px;
            background: rgba(96,165,250,0.07);
            border: 1px solid rgba(96,165,250,0.15);
            border-radius: 10px; font-size: 0.78rem;
            color: #475569; text-align: center; line-height: 1.5;
        }
        .notice span { color: #60a5fa; font-weight: 600; }
    </style>
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="card">
    <div class="logo">tyler<span>.fun</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Don't have an account? <a href="/signup/">Sign up</a></p>

  <a href="/api/auth/github/start" class="github-btn">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
    </a>

    <div class="divider"><span>or log in with email</span></div>

    <div class="field">
        <label for="identifier">Email or username</label>
        <input type="text" id="identifier" autocomplete="username" placeholder="you@example.com" maxlength="254" required />
    </div>
    <div class="field">
        <label for="password">Password <a href="/forgot-password/" class="forgot">Forgot password?</a></label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" maxlength="128" required />
    </div>

    <div id="cf-turnstile"></div>
    <div class="msg" id="msg" role="alert"></div>
    <button class="submit-btn" id="submit" type="button">Log in</button>

    <div class="notice">
        <span>GitHub or email</span> – either works. Or browse as a <a href="/users/Guest/" style="color:#60a5fa;text-decoration:none;font-weight:600;">Guest</a> in the meantime.
    </div>
</div>

<script src="/assets/js/stars.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  TF.initTurnstile($('cf-turnstile'));
  TF.setMsg($('msg'), TF.urlError(), 'error');
  if (await TF.me()) { location.href = '/settings/'; return; }
  async function submit() {
    const btn = $('submit'); btn.disabled = true; TF.setMsg($('msg'), '');
    const r = await TF.api('/auth/login', { method: 'POST', body: { identifier: $('identifier').value, password: $('password').value, turnstile: TF.turnstileToken() } });
    if (r.ok) { location.href = '/u/' + encodeURIComponent(r.data.user.username); return; }
    TF.setMsg($('msg'), r.error.message, 'error'); TF.turnstileReset(); btn.disabled = false;
  }
  $('submit').addEventListener('click', submit);
  for (const id of ['identifier', 'password']) $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
