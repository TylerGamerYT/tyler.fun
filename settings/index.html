<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | tyler.fun</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .settings-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .settings-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #ffffff;
            border-bottom: 1px solid rgba(51, 65, 85, 0.6);
            padding-bottom: 12px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .setting-group select {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .setting-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-save:hover {
            background: #1d4ed8;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .status-message {
            margin-top: 14px;
            font-size: 0.85rem;
            text-align: center;
            color: #22c55e;
            display: none;
        }
    </style>
</head>
<body>

<div class="settings-card">
    <h2>Profile Settings</h2>
    
    <div class="setting-group">
        <label for="userBadgeSelect">Active Custom Profile Badge</label>
        <select id="userBadgeSelect">
            <option value="none">None</option>
            <option value="tyler">Tyler Badge</option>
            <option value="tawsif">Tawsif Badge</option>
            <option value="fish">Fish Badge</option>
        </select>
    </div>

    <div class="setting-group">
        <label for="verifiedToggle">Verified Status Display</label>
        <select id="verifiedToggle">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
        </select>
    </div>

    <button class="btn-save" id="saveSettingsBtn">Save Preferences</button>
    <div class="status-message" id="statusMessage">Settings saved successfully!</div>
</div>

<script src="settings.js"></script>
</body>
</html>
