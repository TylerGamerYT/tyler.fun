<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | tyler.fun</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; padding: 40px; }
        .settings-card { background: rgba(15,23,42,0.8); border: 1px solid rgba(51,65,85,0.6); border-radius: 16px; padding: 24px; max-width: 500px; margin: 0 auto; }
        .setting-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        select, input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; }
        .btn-save { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-save:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="settings-card">
    <h2>Profile Badge Settings</h2>
    
    <div class="setting-group">
        <label for="userBadgeSelect">Active Custom Profile Badge</label>
        <select id="userBadgeSelect">
            <option value="none">None</option>
            <option value="tyler">Tyler Badge</option>
            <option value="tawsif">Tawsif Badge</option>
            <option value="fish">Fish Badge</option>
        </select>
    </div>

    <div class="setting-group">
        <label for="verifiedToggle">Verified Status</label>
        <select id="verifiedToggle">
            <option value="false">Disabled</option>
            <option value="true">Enabled</option>
        </select>
    </div>

    <button class="btn-save" id="saveSettingsBtn">Save Changes</button>
</div>

<script src="settings.js"></script>
</body>
</html>
