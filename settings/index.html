<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | tyler.fun</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <script src="/assets/js/settings.js"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.72);
            --border: rgba(51, 65, 85, 0.7);
            --text: #f8fafc;
            --muted: #94a3b8;
            --dim: #475569;
            --accent: #60a5fa;
        }

        html[data-accent="blue"] {
            --accent: #60a5fa;
        }

        html[data-accent="purple"] {
            --accent: #a78bfa;
        }

        html[data-accent="green"] {
            --accent: #34d399;
        }

        html[data-accent="pink"] {
            --accent: #f472b6;
        }

        html[data-theme="light"] {
            --bg: #f8fafc;
            --panel: rgba(255, 255, 255, 0.85);
            --border: rgba(148, 163, 184, 0.35);
            --text: #0f172a;
            --muted: #475569;
            --dim: #64748b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            margin: 0;
            min-height: 100vh;
            transition:
                background 0.25s,
                color 0.25s;
        }

        .container {
            width: min(720px, calc(100% - 32px));
            margin: 0 auto;
            padding: 70px 0;
        }

        .back {
            display: inline-block;
            color: var(--dim);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 35px;
        }

        .back:hover {
            color: var(--text);
        }

        h1 {
            font-family: "Syne", sans-serif;
            font-size: 2.4rem;
            margin: 0 0 8px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 35px;
        }

        .section {
            margin-bottom: 18px;
        }

        .section-title {
            font-family: "Syne", sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--dim);
            margin: 0 0 9px 6px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(14px);
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }

        .setting:last-child {
            border-bottom: 0;
        }

        .setting-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .setting-description {
            font-size: 0.78rem;
            color: var(--muted);
        }

        select {
            background: rgba(2, 6, 23, 0.7);
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 9px 12px;
            font-family: inherit;
            outline: none;
        }

        .accent-options {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .accent {
            width: 27px;
            height: 27px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .accent.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px var(--accent);
        }

        .blue { background: #60a5fa; }
        .purple { background: #a78bfa; }
        .green { background: #34d399; }
        .pink { background: #f472b6; }

        .toggle {
            width: 46px;
            height: 25px;
            border-radius: 99px;
            border: 0;
            background: #334155;
            padding: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle span {
            display: block;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }

        .toggle.active {
            background: var(--accent);
        }

        .toggle.active span {
            transform: translateX(21px);
        }

        .guest {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .guest strong {
            color: var(--accent);
        }

        .danger {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(248, 113, 113, 0.3);
            background: rgba(127, 29, 29, 0.15);
            color: #fca5a5;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .danger:hover {
            background: rgba(127, 29, 29, 0.25);
        }

        html[data-animations="off"] *,
        html[data-animations="off"] *::before,
        html[data-animations="off"] *::after {
            animation-duration: 0s !important;
            animation-delay: 0s !important;
            transition-duration: 0s !important;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back">← Back to tyler.fun</a>

    <h1>Settings</h1>
    <p class="subtitle">Customize your tyler.fun experience.</p>

    <div class="section">
        <div class="section-title">Account</div>

        <div class="panel">
            <div class="setting">
                <div>
                    <div class="setting-name">Current account</div>
                    <div class="setting-description">
                        Your settings are currently stored on this device.
                    </div>
                </div>

                <div class="guest">
                    <strong>Guest</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Appearance</div>

        <div class="panel">

            <div class="setting">
                <div>
                    <div class="setting-name">Theme</div>
                    <div class="setting-description">
                        Choose how tyler.fun looks.
                    </div>
                </div>

                <select id="theme">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                </select>
            </div>

            <div class="setting">
                <div>
                    <div class="setting-name">Accent colour</div>
                    <div class="setting-description">
                        Change the main highlight colour.
                    </div>
                </div>

                <div class="accent-options">
                    <button class="accent blue" data-accent="blue"></button>
                    <button class="accent purple" data-accent="purple"></button>
                    <button class="accent green" data-accent="green"></button>
                    <button class="accent pink" data-accent="pink"></button>
                </div>
            </div>

            <div class="setting">
                <div>
                    <div class="setting-name">Animations</div>
                    <div class="setting-description">
                        Enable interface animations.
                    </div>
                </div>

                <button class="toggle" id="animations">
                    <span></span>
                </button>
            </div>

        </div>
    </div>

    <button class="danger" id="reset">
        Reset all settings
    </button>

</div>

<script>
    const theme = document.getElementById("theme");
    const animationToggle = document.getElementById("animations");
    const reset = document.getElementById("reset");

    function renderSettings() {
        const settings = getSettings();

        theme.value = settings.theme;

        animationToggle.classList.toggle(
            "active",
            settings.animations
        );

        document.querySelectorAll(".accent").forEach(button => {
            button.classList.toggle(
                "active",
                button.dataset.accent === settings.accent
            );
        });
    }

    theme.addEventListener("change", () => {
        updateSetting("theme", theme.value);
        renderSettings();
    });

    document.querySelectorAll(".accent").forEach(button => {
        button.addEventListener("click", () => {
            updateSetting("accent", button.dataset.accent);
            renderSettings();
        });
    });

    animationToggle.addEventListener("click", () => {
        const settings = getSettings();

        updateSetting(
            "animations",
            !settings.animations
        );

        renderSettings();
    });

    reset.addEventListener("click", () => {
        if (!confirm("Reset all tyler.fun settings?")) return;

        resetSettings();
        renderSettings();
    });

    renderSettings();
</script>

</body>
</html>
