<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pixel-art.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="container">
    <h1>Pixel Art</h1>
    <p class="subtitle">Draw something. Anything.</p>

    <div class="toolbar">
        <button class="tool-btn active" id="toolDraw">✏️ Draw</button>
        <button class="tool-btn" id="toolErase">🧹 Erase</button>
        <button class="tool-btn" id="toolFill">🪣 Fill</button>
        <input type="color" class="color-picker" id="colorPicker" value="#60a5fa">
        <select class="size-select" id="gridSize">
            <option value="16">16×16</option>
            <option value="24" selected>24×24</option>
            <option value="32">32×32</option>
            <option value="48">48×48</option>
        </select>
        <button class="tool-btn" id="clearBtn">🗑️ Clear</button>
        <button class="tool-btn" id="saveBtn">💾 Save</button>
    </div>

    <div class="palette" id="palette"></div>
    <canvas id="pixelCanvas"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
