<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS vs AI | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rps-ai.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="container">
    <h1>RPS vs AI</h1>
    <p class="subtitle">The AI studies your patterns and tries to beat you.</p>

    <div class="scoreboard">
        <div class="score-cell">
            <div class="score-val you" id="youScore">0</div>
            <div class="score-label">You</div>
        </div>
        <div class="score-cell">
            <div class="score-val tie" id="tieScore">0</div>
            <div class="score-label">Ties</div>
        </div>
        <div class="score-cell">
            <div class="score-val ai" id="aiScore">0</div>
            <div class="score-label">AI</div>
        </div>
    </div>

    <div class="arena">
        <div class="player-choice">
            <div class="choice-emoji" id="youEmoji">🤔</div>
            <div class="choice-label">You</div>
        </div>
        <div class="vs-label">VS</div>
        <div class="player-choice">
            <div class="choice-emoji" id="aiEmoji">🤖</div>
            <div class="choice-label">AI</div>
        </div>
    </div>

    <div class="result-text" id="resultText">Make your move</div>
    <div class="ai-comment" id="aiComment">I'm already learning your patterns.</div>

    <div class="btn-row">
        <button class="rps-btn" id="btnR">🪨<span>Rock</span></button>
        <button class="rps-btn" id="btnP">📄<span>Paper</span></button>
        <button class="rps-btn" id="btnS">✂️<span>Scissors</span></button>
    </div>
    <div class="ai-thinking" id="aiThinking"></div>
</div>

<script src="script.js"></script>
</body>
</html>
