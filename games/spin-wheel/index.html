<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="container">
    <h1>Spin the Wheel</h1>
    <p class="subtitle">Every spin has a consequence. Spin responsibly.</p>

    <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>

    <div class="result-box">
        <div class="result-emoji" id="resEmoji">🎰</div>
        <div class="result-title" id="resTitle">Spin the wheel to see your fate.</div>
        <div class="result-desc" id="resDesc"></div>
    </div>
    <div class="spins-label">Total spins: <span id="spinCount">0</span></div>
</div>

<script src="script.js"></script>
</body>
</html>
