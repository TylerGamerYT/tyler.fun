<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Scramble | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="gameover" id="gameover">
    <div class="go-emoji">💀</div>
    <div class="go-title" id="goTitle">Time's up!</div>
    <div class="go-score">You got <span id="goScore">0</span> words &nbsp;·&nbsp; Best streak: <span id="goStreak">0</span></div>
    <button class="go-btn" onclick="startGame()">Play again</button>
</div>

<div class="container">
    <h1>Word Scramble</h1>
    <p class="subtitle">Unscramble the word before time runs out.</p>

    <div class="stats-row">
        <div class="stat"><div class="stat-val" id="scoreVal">0</div><div class="stat-label">score</div></div>
        <div class="stat"><div class="stat-val" id="streakVal">0</div><div class="stat-label">streak 🔥</div></div>
        <div class="stat"><div class="stat-val" id="roundVal">1</div><div class="stat-label">round</div></div>
    </div>

    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>

    <div class="category-badge" id="categoryBadge">loading...</div>

    <div class="scramble-display" id="scrambleDisplay"></div>
    <div class="answer-row" id="answerRow"></div>

    <div class="action-row">
        <button class="action-btn" id="hintBtn" onclick="useHint()">💡 Hint (3 left)</button>
        <button class="action-btn" onclick="clearAnswer()">✕ Clear</button>
        <button class="action-btn" onclick="skipWord()">⏭ Skip</button>
    </div>

    <div class="hint-text" id="hintText"></div>
    <div class="feedback" id="feedback"></div>
</div>

<script src="script.js"></script>
</body>
</html>
