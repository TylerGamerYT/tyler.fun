<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Minesweeper | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="moving-minesweeper.css">
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="overlay" id="overlay">
    <div class="ov-emoji" id="ovEmoji">💣</div>
    <div class="ov-title" id="ovTitle">Boom.</div>
    <div class="ov-sub" id="ovSub">A mine moved into you.</div>
    <button class="ov-btn" id="retryBtn">Try again</button>
</div>

<div class="container">
    <h1>Moving Minesweeper</h1>
    <p class="subtitle">Classic minesweeper but mines drift every few clicks.</p>
    <div class="hud">
        <div class="hud-stat"><div class="hud-val" id="minesLeft">10</div><div class="hud-label">mines</div></div>
        <div class="hud-stat"><div class="hud-val" id="clicksVal">0</div><div class="hud-label">clicks</div></div>
        <div class="hud-stat"><div class="hud-val" id="safeLeft">—</div><div class="hud-label">safe left</div></div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="grid" id="grid"></div>
    <div class="action-row">
        <button class="action-btn" id="flagBtn">🚩 Flag mode</button>
        <button class="action-btn" id="newGameBtn">🔄 New game</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
