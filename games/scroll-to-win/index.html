<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll to Win | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="particles"></canvas>
    <div class="bg-glow"></div>
    <a href="/" class="back-home">← Back to tyler.fun</a>

    <div class="win-screen" id="winScreen">
      <div class="win-emoji">🏆</div>
      <div class="win-title">You actually won.</div>
      <div class="win-sub">I genuinely didn't think you'd make it.</div>
      <button class="win-btn" id="winBtn">Play again (why?)</button>
    </div>

    <div class="container">
      <h1>Scroll to Win</h1>
      <p class="subtitle">Scroll up to fill the bar. It drains when you stop.</p>

      <div class="pct" id="pct">0%</div>
      <div class="pct-label">complete</div>

      <div class="bar-wrap">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="scroll-hint" id="scrollHint">↑ Scroll up to begin</div>
      <div class="comment" id="comment">You've got this. Probably.</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
