<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Sprint | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="math-sprint.css" />
  </head>
  <body>
    <canvas id="particles"></canvas>
    <div class="bg-glow"></div>
    <a href="/" class="back-home">← Back to tyler.fun</a>

    <div class="gameover" id="gameover">
      <div class="go-emoji">🧮</div>
      <div class="go-title" id="goTitle">Time's up!</div>
      <div class="go-sub">
        Score: <span id="goScore">0</span> · Best streak:
        <span id="goStreak">0</span>
      </div>
      <button class="go-btn" id="playAgainBtn">Play again</button>
    </div>

    <div class="container">
      <h1>Math Sprint</h1>
      <p class="subtitle">Answer as fast as you can. 60 seconds.</p>

      <div class="difficulty-row">
        <button class="diff-btn active" id="dEasy">
          Easy
        </button>
        <button class="diff-btn" id="dMedium">
          Medium
        </button>
        <button class="diff-btn" id="dHard">
          Hard
        </button>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="scoreVal">0</div>
          <div class="stat-label">score</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="streakVal">0</div>
          <div class="stat-label">streak 🔥</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="timeVal">60</div>
          <div class="stat-label">seconds</div>
        </div>
      </div>

      <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>

      <div class="question-display" id="question">?</div>
      <input
        type="number"
        class="answer-input"
        id="answerInput"
        placeholder="?"
        autocomplete="off"
      />
      <div class="feedback" id="feedback">Type your answer and press Enter</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
