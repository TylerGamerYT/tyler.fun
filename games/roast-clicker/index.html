<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roast Clicker | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="roast-clicker.css">
</head>
<body>

<canvas id="particles"></canvas>
<div class="bg-glow"></div>

<a href="/" class="back-home">← Back to tyler.fun</a>

<div class="milestone" id="milestone">
    <div class="milestone-text" id="milestone-text"></div>
</div>

<div class="container">
    <h1>Roast Clicker</h1>
    <p class="subtitle">The more you click, the worse it gets.</p>

    <div class="counter" id="counter">0</div>
    <div class="clicks-label">clicks</div>

    <div class="roast-box">
        <div class="roast-text" id="roast">Click the button. Go on. I dare you.</div>
    </div>

    <button class="click-btn" id="clickBtn">CLICK<br>ME</button>
</div>

<script src="script.js"></script>
</body>
</html>
