<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socials | tyler.fun</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="particles"></canvas>
<div class="bg-glow"></div>

<div class="links-container">

    <div class="profile-pic">
        <img src="https://avatars.githubusercontent.com/TylerGamerYT?v=4" alt="Tyler's Profile Picture">
    </div>

    <h2>tyler.fun</h2>
    <div class="username">@tylergameryt</div>

    <a href="https://www.tiktok.com/@tylergameryt" target="_blank" class="social-link tiktok link-1">
        <img src="/assets/icons/Tiktok-icon.svg" alt="TikTok Icon" class="icon">
        TikTok
    </a>

    <a href="https://x.com/TylerGamerYT" target="_blank" class="social-link twitter link-2">
        <img src="/assets/icons/Twitter-icon.svg" alt="Twitter Icon" class="icon">
        Twitter
    </a>

    <a href="https://www.instagram.com/tylergameryt_" target="_blank" class="social-link insta link-3">
        <img src="/assets/icons/Instagram-icon.svg" alt="Instagram Icon" class="icon">
        Instagram
    </a>

    <a href="https://github.com/TylerGamerYT" target="_blank" class="social-link github link-4">
        <img src="/assets/icons/Github-icon.svg" alt="GitHub Icon" class="icon">
        GitHub
    </a>

    <a href="/" class="back-home">← Back to tyler.fun</a>

</div>

<script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function initStars() {
        stars = [];
        const count = Math.floor((W * H) / 8000);

        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 1.1 + 0.3,
                speed: Math.random() * 0.14 + 0.03,
                opacity: Math.random() * 0.45 + 0.1,
                twinkleSpeed: Math.random() * 0.01 + 0.003,
                twinkleOffset: Math.random() * Math.PI * 2,
            });
        }
    }

    let t = 0;

    function draw() {
        ctx.clearRect(0, 0, W, H);
        t += 0.016;

        for (const s of stars) {
            const alpha =
                s.opacity +
                Math.sin(t * s.twinkleSpeed * 60 + s.twinkleOffset) * 0.14;

            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(148, 197, 255, ${Math.max(0, alpha)})`;
            ctx.fill();

            s.y -= s.speed;

            if (s.y < -2) {
                s.y = H + 2;
                s.x = Math.random() * W;
            }
        }

        requestAnimationFrame(draw);
    }

    resize();
    initStars();
    draw();

    window.addEventListener('resize', () => {
        resize();
        initStars();
    });
</script>

</body>
</html>
