<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click the Colour | tyler.fun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { background: #020617; color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; user-select: none; text-align: center; }
        #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% 40%, #1e3a8a44 0%, transparent 70%); z-index: 0; pointer-events: none; }
        .back-home { position: fixed; top: 20px; left: 24px; font-size: 0.85rem; color: #475569; text-decoration: none; z-index: 10; }
        .back-home:hover { color: #fff; }
        .container { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 24px; max-width: 500px; width: 100%; }
        h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem,8vw,3rem); font-weight: 900; margin: 0 0 4px; letter-spacing: -2px; }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; }
        .stats-row { display: flex; gap: 24px; margin-bottom: 20px; }
        .stat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .stat-val { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 900; color: #f8fafc; }
        .stat-label { font-size: 0.7rem; color: #475569; text-transform: uppercase; letter-spacing: 1.5px; }
        .timer-wrap { width: 100%; height: 8px; background: rgba(30,58,138,0.25); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
        .timer-bar { height: 100%; border-radius: 999px; background: #3b82f6; transition: width 0.1s linear, background 0.3s; }
        .timer-bar.warn { background: #fbbf24; }
        .timer-bar.danger { background: #ef4444; }
        .prompt { font-family: 'Syne', sans-serif; font-size: clamp(2.5rem,10vw,4rem); font-weight: 900; margin-bottom: 28px; min-height: 1.2em; transition: all 0.2s; }
        .colour-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; width: 100%; margin-bottom: 20px; }
        .colour-btn { height: 80px; border-radius: 16px; border: 3px solid transparent; cursor: pointer; transition: transform 0.1s, border-color 0.15s, box-shadow 0.15s; font-family: 'Syne', sans-serif; font-size: 0.9rem; font-weight: 700; color: rgba(255,255,255,0.8); }
        .colour-btn:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .colour-btn:active { transform: scale(0.97); }
        .colour-btn.correct { border-color: #10b981; box-shadow: 0 0 24px rgba(16,185,129,0.4); }
        .colour-btn.wrong { border-color: #ef4444; box-shadow: 0 0 24px rgba(239,68,68,0.4); }
        .feedback { font-size: 1rem; min-height: 24px; font-weight: 600; transition: color 0.2s; }
        .feedback.good { color: #10b981; }
        .feedback.bad { color: #f87171; }
        .gameover { position: fixed; inset: 0; background: rgba(2,6,23,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.4s; backdrop-filter: blur(8px); }
        .gameover.show { opacity: 1; pointer-events: all; }
        .go-emoji { font-size: 4rem; margin-bottom: 12px; }
        .go-title { font-family: 'Syne', sans-serif; font-size: clamp(1.8rem,7vw,2.8rem); font-weight: 900; margin: 0 0 8px; }
        .go-sub { color: #64748b; font-size: 1rem; margin-bottom: 28px; }
        .go-sub span { color: #60a5fa; font-weight: 700; }
        .go-btn { padding: 13px 36px; background: rgba(37,99,235,0.3); border: 1.5px solid rgba(96,165,250,0.45); border-radius: 999px; color: #fff; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .go-btn:hover { background: rgba(37,99,235,0.5); }
    </style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="bg-glow"></div>
<a href="/" class="back-home">← Back to tyler.fun</a>
<div class="gameover" id="gameover">
    <div class="go-emoji">🎨</div>
    <div class="go-title" id="goTitle">Time's up!</div>
    <div class="go-sub">Score: <span id="goScore">0</span> · Streak: <span id="goStreak">0</span></div>
    <button class="go-btn" onclick="startGame()">Play again</button>
</div>
<div class="container">
    <h1>Click the Colour</h1>
    <p class="subtitle">Click the colour that matches the word. Not the colour of the word.</p>
    <div class="stats-row">
        <div class="stat"><div class="stat-val" id="scoreVal">0</div><div class="stat-label">score</div></div>
        <div class="stat"><div class="stat-val" id="streakVal">0</div><div class="stat-label">streak 🔥</div></div>
        <div class="stat"><div class="stat-val" id="timeVal">30</div><div class="stat-label">seconds</div></div>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div class="prompt" id="prompt">RED</div>
    <div class="colour-grid" id="colourGrid"></div>
    <div class="feedback" id="feedback">Click the colour named above</div>
</div>
<script>
const COLOURS = [
    { name: 'Red',    hex: '#ef4444' },
    { name: 'Blue',   hex: '#3b82f6' },
    { name: 'Green',  hex: '#22c55e' },
    { name: 'Yellow', hex: '#fbbf24' },
    { name: 'Purple', hex: '#a855f7' },
    { name: 'Orange', hex: '#f97316' },
    { name: 'Pink',   hex: '#ec4899' },
    { name: 'Teal',   hex: '#14b8a6' },
];
const TIME = 30;
let score=0, streak=0, bestStreak=0, timeLeft=TIME, timerInterval=null, started=false, answered=false;
let correctColour = null;

function startGame() {
    score=0; streak=0; bestStreak=0; timeLeft=TIME; started=false; answered=false;
    clearInterval(timerInterval);
    document.getElementById('gameover').classList.remove('show');
    document.getElementById('timerBar').style.width='100%';
    document.getElementById('timerBar').className='timer-bar';
    updateStats();
    nextRound();
    document.getElementById('feedback').textContent='Click the colour named above';
    document.getElementById('feedback').className='feedback';
}

function nextRound() {
    answered = false;
    // pick correct colour
    correctColour = COLOURS[Math.floor(Math.random()*COLOURS.length)];
    // pick 3 wrong colours
    const others = COLOURS.filter(c=>c.name!==correctColour.name).sort(()=>Math.random()-0.5).slice(0,3);
    const options = [...others, correctColour].sort(()=>Math.random()-0.5);
    // pick a distractor colour for the text (different from correct)
    const distractor = COLOURS.filter(c=>c.name!==correctColour.name)[Math.floor(Math.random()*7)];

    const prompt = document.getElementById('prompt');
    prompt.textContent = correctColour.name.toUpperCase();
    prompt.style.color = distractor.hex;

    const grid = document.getElementById('colourGrid');
    grid.innerHTML='';
    options.forEach(c => {
        const btn = document.createElement('button');
        btn.className='colour-btn';
        btn.style.background=c.hex;
        btn.onclick=()=>answer(c, btn);
        grid.appendChild(btn);
    });
}

function answer(c, btn) {
    if (answered) return;
    answered=true;
    if (!started) { started=true; startTimer(); }

    if (c.name===correctColour.name) {
        score+=streak>4?3:1; streak++;
        if (streak>bestStreak) bestStreak=streak;
        btn.classList.add('correct');
        setFeedback('✓ Correct!','good');
    } else {
        streak=0;
        btn.classList.add('wrong');
        // show correct
        document.querySelectorAll('.colour-btn').forEach((b,i)=>{
            if (b.style.background===hexToRgb(correctColour.hex)||b.style.backgroundColor===correctColour.hex) b.classList.add('correct');
        });
        setFeedback(`✗ That was ${c.name.toLowerCase()}. You needed ${correctColour.name.toLowerCase()}.`,'bad');
    }
    updateStats();
    setTimeout(nextRound, 600);
}

function hexToRgb(hex) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgb(${r}, ${g}, ${b})`;
}

function setFeedback(msg,cls) { const el=document.getElementById('feedback'); el.textContent=msg; el.className='feedback '+cls; }

function startTimer() {
    timerInterval=setInterval(()=>{
        timeLeft=Math.max(0,timeLeft-0.1);
        updateStats();
        const pct=(timeLeft/TIME)*100;
        const bar=document.getElementById('timerBar');
        bar.style.width=pct+'%';
        bar.className='timer-bar'+(pct<25?' danger':pct<50?' warn':'');
        if (timeLeft<=0) endGame();
    },100);
}

function updateStats() {
    document.getElementById('scoreVal').textContent=score;
    document.getElementById('streakVal').textContent=streak;
    document.getElementById('timeVal').textContent=Math.ceil(timeLeft);
}

function endGame() {
    clearInterval(timerInterval);
    const title=score<5?'Colour blind?':score<15?'Not bad!':score<30?'Sharp eyes!':'Colour wizard.';
    document.getElementById('goTitle').textContent=title;
    document.getElementById('goScore').textContent=score;
    document.getElementById('goStreak').textContent=bestStreak;
    document.getElementById('gameover').classList.add('show');
}

startGame();

const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
let W,H,stars=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
function initStars(){stars=[];for(let i=0;i<Math.floor((W*H)/8000);i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+0.3,speed:Math.random()*0.14+0.03,opacity:Math.random()*0.45+0.1,ts:Math.random()*0.01+0.003,to:Math.random()*Math.PI*2});}
let t=0;
function draw(){ctx.clearRect(0,0,W,H);t+=0.016;for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(148,197,255,${Math.max(0,s.opacity+Math.sin(t*s.ts*60+s.to)*0.14)})`;ctx.fill();s.y-=s.speed;if(s.y<-2){s.y=H+2;s.x=Math.random()*W;}}requestAnimationFrame(draw);}
resize();initStars();draw();
window.addEventListener('resize',()=>{resize();initStars();});
</script>
</body>
</html>
